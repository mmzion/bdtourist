<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>আমার বাংলাদেশ — ম্যাপ</title>
<meta name="description" content="বাংলাদেশের ৬৪ জেলার ইন্টারঅ্যাক্টিভ ম্যাপ।">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23006A4E'/><circle cx='50' cy='50' r='26' fill='%23F42A41'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="page-map">

<header>
  <nav class="nav">
    <a href="index.html" class="brand">
      <span class="brand-mark"></span>
      <span>আমার বাংলাদেশ</span>
    </a>
    <div class="nav-links">
      <a href="index.html" class="active">🗺️ ম্যাপ</a>
      <a href="details.html">📖 বিস্তারিত</a>
    </div>
    <div class="nav-stats">
      <div><b id="navVisited">০</b> / ৬৪ জেলা</div>
    </div>
  </nav>
</header>

<div class="map-wrap">
  <div id="map"></div>

  <div class="map-overlay top">
    <div class="map-search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
      </svg>
      <input type="text" id="mapSearch" placeholder="জেলা বা স্থান খুঁজুন...">
    </div>
    <div class="legend">
      <span><i class="dot-v"></i>ভ্রমণ করেছি</span>
      <span><i class="dot-u"></i>বাকি আছে</span>
    </div>
  </div>

  <div class="map-overlay bottom">
    <div class="map-hint">
      <span>👆</span> যেকোনো জেলায় ক্লিক করুন
    </div>
    <div class="progress-pill">
      <div class="ring" id="miniRing">
        <b id="miniPct">০%</b>
      </div>
      <div class="txt">
        <b><span id="miniVisited">০</span> জেলা</b>
        <span>ভ্রমণ সম্পন্ন</span>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js"></script>
<script>
let map, markers = {};
let visited = getVisited();

function initMap(){
  map = L.map('map',{zoomControl:true,scrollWheelZoom:true}).setView([23.7,90.35],7);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
    maxZoom:18, subdomains:'abcd',
    attribution:'&copy; OpenStreetMap &copy; CARTO'
  }).addTo(map);

  DISTRICTS.forEach(d => {
    const m = L.circleMarker([d.lat,d.lng],{
      radius:9, color:"#fff", weight:2.5,
      fillColor:"#b9c3bd", fillOpacity:1
    }).addTo(map);

    m.bindTooltip(d.name,{direction:"top",offset:[0,-8],className:"district-tip"});
    m.on('click', () => openPopup(d, m));
    m.on('mouseover', function(){ this.setRadius(12); });
    m.on('mouseout', function(){ this.setRadius(visited.has(d.id)?10:9); });

    markers[d.id] = m;
  });

  map.fitBounds([[20.4,87.9],[26.7,92.8]]);
  refreshMarkers();
  updateStats();
}

function refreshMarkers(){
  DISTRICTS.forEach(d => {
    const m = markers[d.id];
    if (!m) return;
    if (visited.has(d.id)){
      m.setStyle({fillColor:"#006A4E",color:"#fff",weight:3});
      m.setRadius(10);
      m.bindTooltip(d.name + " ✓",{direction:"top",offset:[0,-8],className:"district-tip visited"});
    } else {
      m.setStyle({fillColor:"#b9c3bd",color:"#fff",weight:2.5});
      m.setRadius(9);
      m.bindTooltip(d.name,{direction:"top",offset:[0,-8],className:"district-tip"});
    }
  });
}

function openPopup(d, m){
  const isV = visited.has(d.id);
  const html = `
    <div class="popup-head">
      <h3>${d.name}</h3>
      <span>${d.division} বিভাগ • ${bn(d.spots.length)}টি দর্শনীয় স্থান</span>
    </div>
    <div class="popup-body">
      <p>${d.spots[0][0]}${d.spots[1] ? ' • ' + d.spots[1][0] : ''}${d.spots[2] ? ' সহ আরও...' : ''}</p>
      <div class="popup-actions">
        <a href="details.html#${d.id}" class="popup-btn btn-detail">📖 বিস্তারিত</a>
        <button class="popup-btn btn-mark ${isV?'active':''}" data-id="${d.id}">
          ${isV ? '✓ ভ্রমণ করেছি' : '○ চিহ্নিত করুন'}
        </button>
      </div>
    </div>
  `;

  const popup = L.popup({
    maxWidth:260, minWidth:240, closeButton:true,
    offset:[0,-6], className:'custom-popup'
  }).setLatLng([d.lat, d.lng]).setContent(html).openOn(map);

  // বাটন ইভেন্ট
  setTimeout(() => {
    const btn = document.querySelector('.leaflet-popup-content .btn-mark');
    if (btn){
      btn.addEventListener('click', () => {
        toggleVisited(d.id);
        visited = getVisited();
        refreshMarkers();
        updateStats();
        // popup রিফ্রেশ
        map.closePopup();
        openPopup(d, m);
      });
    }
  }, 50);
}

function updateStats(){
  const total = DISTRICTS.length;
  const count = visited.size;
  const pct = Math.round((count/total)*100);
  document.getElementById('miniPct').textContent = bn(pct) + '%';
  document.getElementById('miniRing').style.setProperty('--p', pct);
  document.getElementById('miniVisited').textContent = bn(count);
  document.getElementById('navVisited').textContent = bn(count);
}

// সার্চ — ম্যাপে জুম করে দেখাবে
document.getElementById('mapSearch').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) return;
  const d = DISTRICTS.find(x =>
    x.name.toLowerCase().includes(q) ||
    x.division.toLowerCase().includes(q) ||
    x.spots.some(s => s[0].toLowerCase().includes(q))
  );
  if (d){
    map.flyTo([d.lat,d.lng], Math.max(map.getZoom(), 9), {duration:0.8});
    setTimeout(() => openPopup(d, markers[d.id]), 900);
  }
});

initMap();
</script>
</body>
</html>
