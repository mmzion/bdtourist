<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>আমার বাংলাদেশ — ভ্রমণ ম্যাপ</title>
<meta name="description" content="বাংলাদেশের ৬৪ জেলার ইন্টারঅ্যাক্টিভ ভ্রমণ ম্যাপ — কোনো API key ছাড়াই।">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23006A4E'/><circle cx='50' cy='50' r='26' fill='%23F42A41'/></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Leaflet — ফ্রি, ওপেন সোর্স, কোনো API key নেই -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --green:#006A4E;
  --green-dark:#00432f;
  --green-light:#0b8a67;
  --red:#F42A41;
  --cream:#f4f7f4;
  --ink:#0f231c;
  --muted:#5f7068;
  --line:#e0e7e2;
  --card:#ffffff;
  --shadow-sm:0 2px 10px rgba(0,60,44,.06);
  --shadow:0 8px 30px rgba(0,60,44,.15);
  --shadow-lg:0 20px 60px rgba(0,60,44,.25);
}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Hind Siliguri',system-ui,-apple-system,sans-serif;
  background:#dfe8e3;
  color:var(--ink);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}

/* ============ ম্যাপ ============ */
#map{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:1;
  background:#dfe8e3;
}

/* Leaflet কাস্টমাইজ */
.leaflet-container{
  font-family:'Hind Siliguri',sans-serif;
  background:#dfe8e3;
}
.leaflet-control-attribution{
  background:rgba(255,255,255,.85)!important;
  font-size:.68rem!important;
  padding:2px 8px!important;
  border-radius:8px 0 0 0!important;
  color:var(--muted)!important;
}
.leaflet-control-attribution a{color:var(--green)!important}
.leaflet-control-zoom{
  border:none!important;
  box-shadow:var(--shadow)!important;
  border-radius:14px!important;
  overflow:hidden;
  margin-right:18px!important;
  margin-bottom:18px!important;
}
.leaflet-control-zoom a{
  background:#fff!important;
  color:var(--green-dark)!important;
  border-color:var(--line)!important;
  width:40px!important;
  height:40px!important;
  line-height:40px!important;
  font-size:1.25rem!important;
  font-weight:700!important;
  transition:.2s;
}
.leaflet-control-zoom a:hover{
  background:var(--green)!important;
  color:#fff!important;
}
.leaflet-control-zoom-in{border-bottom:1px solid var(--line)!important}

/* টুলটিপ */
.leaflet-tooltip.district-tip{
  font-family:'Hind Siliguri',sans-serif;
  font-weight:600;
  font-size:.82rem;
  background:var(--green-dark);
  color:#fff;
  border:none;
  border-radius:8px;
  padding:4px 11px;
  box-shadow:0 4px 14px rgba(0,0,0,.3);
}
.leaflet-tooltip.district-tip::before{border-top-color:var(--green-dark)}
.leaflet-tooltip.district-tip.visited{background:var(--red)}
.leaflet-tooltip.district-tip.visited::before{border-top-color:var(--red)}

/* পপআপ */
.leaflet-popup-content-wrapper{
  border-radius:16px!important;
  box-shadow:var(--shadow-lg)!important;
  padding:0!important;
  overflow:hidden;
}
.leaflet-popup-content{
  margin:0!important;
  min-width:260px;
  line-height:1.5;
}
.leaflet-popup-tip{
  box-shadow:var(--shadow)!important;
}
.leaflet-popup-close-button{
  color:#fff!important;
  top:8px!important;
  right:8px!important;
  width:28px!important;
  height:28px!important;
  font-size:20px!important;
  font-weight:400!important;
  border-radius:50%;
  display:grid!important;
  place-items:center;
  transition:.2s;
}
.leaflet-popup-close-button:hover{
  background:rgba(255,255,255,.2);
}

.popup-head{
  background:linear-gradient(135deg,var(--green),var(--green-dark));
  color:#fff;
  padding:16px 18px 14px;
}
.popup-head h3{
  font-size:1.15rem;
  font-weight:700;
  margin-bottom:3px;
}
.popup-head span{
  font-size:.8rem;
  opacity:.9;
}
.popup-body{
  padding:14px 18px 16px;
  background:#fff;
}
.popup-body > p{
  font-size:.87rem;
  color:var(--muted);
  line-height:1.6;
  margin-bottom:12px;
}
.popup-actions{
  display:flex;
  gap:8px;
}
.popup-btn{
  flex:1;
  padding:9px 10px;
  border-radius:10px;
  font-size:.83rem;
  font-weight:600;
  text-align:center;
  transition:.22s;
  white-space:nowrap;
}
.btn-detail{
  background:var(--green);
  color:#fff;
  box-shadow:0 4px 12px rgba(0,106,78,.3);
}
.btn-detail:hover{background:var(--green-dark);transform:translateY(-1px)}
.btn-mark{
  background:#eef2ef;
  color:var(--green-dark);
}
.btn-mark:hover{background:#e2ebe6}
.btn-mark.active{
  background:var(--red);
  color:#fff;
}

/* ============ হেডার ============ */
.header{
  position:fixed;
  top:0;left:0;right:0;
  z-index:1000;
  background:linear-gradient(135deg,rgba(0,106,78,.97),rgba(0,67,47,.97));
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  color:#fff;
  padding:12px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  box-shadow:0 4px 20px rgba(0,0,0,.18);
  transition:transform .3s;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:700;
  font-size:1.15rem;
  letter-spacing:.2px;
  cursor:pointer;
  user-select:none;
}
.brand-mark{
  width:30px;height:30px;
  border-radius:50%;
  background:var(--red);
  box-shadow:0 0 0 3px rgba(255,255,255,.25);
  flex:none;
  animation:pulse 3s ease-in-out infinite;
  position:relative;
}
.brand-mark::after{
  content:"";
  position:absolute;
  inset:-4px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.15);
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 3px rgba(255,255,255,.25)}
  50%{box-shadow:0 0 0 8px rgba(255,255,255,.08)}
}
.brand-text{display:flex;flex-direction:column;line-height:1.1}
.brand-text small{
  font-size:.72rem;
  font-weight:400;
  opacity:.75;
  letter-spacing:.3px;
}
.brand-text b{font-size:1.08rem;font-weight:700}

.header-actions{
  display:flex;
  align-items:center;
  gap:10px;
}
.header-stats{
  display:flex;
  gap:16px;
  padding:7px 16px;
  background:rgba(255,255,255,.12);
  border-radius:999px;
  font-size:.85rem;
  border:1px solid rgba(255,255,255,.1);
}
.header-stats > div{
  display:flex;
  align-items:center;
  gap:6px;
  white-space:nowrap;
}
.header-stats b{
  color:#ffd166;
  font-weight:700;
  font-size:1rem;
}
.header-stats span{opacity:.9}

.menu-btn{
  width:42px;height:42px;
  border-radius:12px;
  background:rgba(255,255,255,.14);
  display:none;
  align-items:center;
  justify-content:center;
  transition:.2s;
}
.menu-btn:hover{background:rgba(255,255,255,.25)}
.menu-btn svg{width:22px;height:22px}

/* ============ ফ্লোটিং সার্চ ============ */
.search-wrap{
  position:fixed;
  top:80px;
  left:20px;
  z-index:900;
  width:min(360px,calc(100vw - 40px));
  pointer-events:auto;
}
.search-box{
  background:#fff;
  border-radius:16px;
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  padding:0 16px;
  border:1.5px solid rgba(255,255,255,.5);
  transition:.25s;
}
.search-box:focus-within{
  box-shadow:0 12px 40px rgba(0,106,78,.2);
  border-color:var(--green);
}
.search-box svg{
  width:18px;height:18px;
  opacity:.4;
  flex:none;
  color:var(--ink);
}
.search-box input{
  border:none;
  outline:none;
  padding:13px 10px;
  font-size:.95rem;
  width:100%;
  background:transparent;
  color:var(--ink);
}
.search-box input::placeholder{color:#8b9a92}
.clear-btn{
  width:24px;height:24px;
  border-radius:50%;
  background:#eef2ef;
  color:var(--muted);
  display:none;
  align-items:center;
  justify-content:center;
  font-size:.9rem;
  flex:none;
  transition:.2s;
}
.clear-btn:hover{background:#e2ebe6}
.clear-btn.show{display:flex}

/* ============ লেজেন্ড ============ */
.legend{
  position:fixed;
  top:80px;
  right:20px;
  z-index:900;
  background:#fff;
  border-radius:14px;
  box-shadow:var(--shadow);
  padding:11px 16px;
  display:flex;
  flex-direction:column;
  gap:8px;
  font-size:.82rem;
  font-weight:500;
  color:var(--muted);
  min-width:150px;
}
.legend-title{
  font-weight:600;
  color:var(--green-dark);
  font-size:.78rem;
  text-transform:uppercase;
  letter-spacing:.5px;
  margin-bottom:2px;
  padding-bottom:6px;
  border-bottom:1px dashed var(--line);
}
.legend-item{
  display:flex;
  align-items:center;
  gap:8px;
}
.legend-item i{
  width:12px;height:12px;
  border-radius:50%;
  flex:none;
  display:block;
}
.dot-v{background:var(--green);box-shadow:0 0 0 3px rgba(0,106,78,.18)}
.dot-u{background:#b9c3bd;box-shadow:0 0 0 3px rgba(185,195,189,.3)}

/* ============ ম্যাপ হিন্ট ============ */
.map-hint{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);
  z-index:900;
  background:rgba(0,67,47,.92);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  color:#fff;
  border-radius:999px;
  padding:10px 22px;
  font-size:.87rem;
  font-weight:500;
  box-shadow:var(--shadow-lg);
  display:flex;
  align-items:center;
  gap:9px;
  animation:fadeInUp .6s .3s both;
  pointer-events:none;
}
.map-hint span{font-size:1.1rem}
@keyframes fadeInUp{
  from{opacity:0;transform:translateX(-50%) translateY(20px)}
  to{opacity:1;transform:translateX(-50%) translateY(0)}
}
.map-hint.hide{display:none}

/* ============ প্রোগ্রেস পিল ============ */
.progress-pill{
  position:fixed;
  bottom:24px;
  left:20px;
  z-index:900;
  background:#fff;
  border-radius:16px;
  box-shadow:var(--shadow);
  padding:12px 18px;
  display:flex;
  align-items:center;
  gap:14px;
  border:1px solid var(--line);
}
.ring{
  --p:0;
  width:58px;height:58px;
  border-radius:50%;
  background:conic-gradient(var(--red) calc(var(--p)*1%),#e4e9e5 0);
  display:grid;
  place-items:center;
  position:relative;
  flex:none;
  transition:background .8s cubic-bezier(.22,1,.36,1);
}
.ring::after{
  content:"";
  position:absolute;
  inset:6px;
  border-radius:50%;
  background:#fff;
  box-shadow:inset 0 2px 8px rgba(0,60,44,.08);
}
.ring b{
  position:relative;
  z-index:2;
  font-size:.92rem;
  font-weight:700;
  color:var(--green-dark);
}
.pill-text{line-height:1.25}
.pill-text b{
  display:block;
  font-size:1.05rem;
  font-weight:700;
  color:var(--green-dark);
}
.pill-text span{
  font-size:.76rem;
  color:var(--muted);
}

/* ============ সাইড প্যানেল ============ */
.panel-overlay{
  position:fixed;
  inset:0;
  background:rgba(8,30,23,.5);
  backdrop-filter:blur(3px);
  z-index:1100;
  opacity:0;
  visibility:hidden;
  transition:.3s;
}
.panel-overlay.open{opacity:1;visibility:visible}

.panel{
  position:fixed;
  top:0;
  right:0;
  bottom:0;
  width:min(420px,100vw);
  background:var(--cream);
  z-index:1200;
  display:flex;
  flex-direction:column;
  box-shadow:-10px 0 50px rgba(0,60,44,.2);
  transform:translateX(100%);
  transition:transform .4s cubic-bezier(.22,1,.36,1);
}
.panel.open{transform:translateX(0)}

.panel-head{
  background:linear-gradient(135deg,var(--green),var(--green-dark));
  color:#fff;
  padding:22px 22px 18px;
  flex:none;
}
.panel-head-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  margin-bottom:16px;
}
.panel-title{
  font-size:1.25rem;
  font-weight:700;
  margin-bottom:3px;
}
.panel-sub{
  font-size:.85rem;
  opacity:.85;
}
.close-panel{
  width:36px;height:36px;
  border-radius:50%;
  background:rgba(255,255,255,.15);
  color:#fff;
  display:grid;
  place-items:center;
  font-size:1.3rem;
  line-height:1;
  transition:.25s;
  flex:none;
}
.close-panel:hover{background:rgba(255,255,255,.3);transform:rotate(90deg)}

.panel-progress{
  display:flex;
  align-items:center;
  gap:16px;
  background:rgba(255,255,255,.1);
  padding:12px 16px;
  border-radius:14px;
}
.panel-progress .ring{
  width:52px;height:52px;
  background:conic-gradient(#ffd166 calc(var(--p)*1%),rgba(255,255,255,.2) 0);
}
.panel-progress .ring::after{
  inset:5px;
  background:var(--green-dark);
  box-shadow:none;
}
.panel-progress .ring b{color:#fff;font-size:.85rem}
.panel-progress .pill-text b{color:#fff}
.panel-progress .pill-text span{color:rgba(255,255,255,.75)}

.panel-tabs{
  display:flex;
  gap:6px;
  padding:14px 18px;
  background:#fff;
  border-bottom:1px solid var(--line);
  overflow-x:auto;
  scrollbar-width:none;
  flex:none;
}
.panel-tabs::-webkit-scrollbar{display:none}
.tab{
  padding:7px 15px;
  border-radius:999px;
  font-size:.85rem;
  font-weight:500;
  color:var(--muted);
  background:#eef2ef;
  transition:.22s;
  white-space:nowrap;
  flex:none;
  border:1.4px solid transparent;
}
.tab:hover{background:#e2ebe6;color:var(--green)}
.tab.active{
  background:var(--green);
  color:#fff;
  box-shadow:0 4px 14px rgba(0,106,78,.32);
}

.panel-list{
  flex:1;
  overflow-y:auto;
  padding:14px;
  scrollbar-width:thin;
}
.panel-list::-webkit-scrollbar{width:8px}
.panel-list::-webkit-scrollbar-track{background:transparent}
.panel-list::-webkit-scrollbar-thumb{
  background:#cdd9d2;
  border-radius:99px;
}
.panel-list::-webkit-scrollbar-thumb:hover{background:#a8b8ae}

.district-item{
  background:#fff;
  border-radius:14px;
  padding:14px 16px;
  margin-bottom:9px;
  display:flex;
  align-items:center;
  gap:13px;
  cursor:pointer;
  transition:.22s;
  border:1.5px solid transparent;
  box-shadow:0 1px 4px rgba(0,60,44,.04);
}
.district-item:hover{
  transform:translateX(-3px);
  box-shadow:var(--shadow-sm);
  border-color:#cfe0d8;
}
.district-item.visited{
  background:linear-gradient(135deg,#f0faf5,#ffffff);
  border-color:#bfe3d5;
}
.di-tick{
  width:38px;height:38px;
  border-radius:11px;
  background:#eef2ef;
  color:#9aa8a1;
  display:grid;
  place-items:center;
  font-size:1rem;
  font-weight:700;
  flex:none;
  transition:.25s;
}
.district-item.visited .di-tick{
  background:var(--green);
  color:#fff;
  box-shadow:0 4px 12px rgba(0,106,78,.3);
}
.di-body{flex:1;min-width:0}
.di-name{
  font-size:1rem;
  font-weight:600;
  color:var(--green-dark);
  display:flex;
  align-items:center;
  gap:7px;
  margin-bottom:3px;
}
.di-div{
  font-size:.7rem;
  font-weight:500;
  color:var(--green);
  background:#eef4f1;
  padding:1px 8px;
  border-radius:999px;
  flex:none;
}
.di-spot{
  font-size:.82rem;
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.di-arrow{
  color:#c4d0c9;
  font-size:1.1rem;
  flex:none;
  transition:.22s;
}
.district-item:hover .di-arrow{
  color:var(--green);
  transform:translateX(-2px);
}

.empty-state{
  text-align:center;
  padding:60px 20px;
  color:var(--muted);
}
.empty-state svg{opacity:.3;margin-bottom:14px;width:54px;height:54px}
.empty-state p{font-size:.92rem}

/* ============ মোডাল (ডিটেইল) ============ */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(8,30,23,.55);
  backdrop-filter:blur(6px);
  z-index:2000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  opacity:0;
  visibility:hidden;
  transition:.3s;
}
.modal-overlay.open{opacity:1;visibility:visible}

.modal{
  background:#fff;
  border-radius:22px;
  width:100%;
  max-width:600px;
  max-height:88vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  box-shadow:0 30px 80px rgba(0,0,0,.4);
  transform:translateY(28px) scale(.97);
  transition:.35s cubic-bezier(.22,1,.36,1);
}
.modal-overlay.open .modal{transform:translateY(0) scale(1)}

.modal-head{
  background:linear-gradient(135deg,var(--green),var(--green-dark));
  color:#fff;
  padding:24px 26px 20px;
  position:relative;
  flex:none;
}
.modal-head h2{font-size:1.5rem;font-weight:700;margin-bottom:3px}
.modal-head span{opacity:.85;font-size:.88rem}
.modal-close{
  position:absolute;
  right:16px;top:16px;
  width:36px;height:36px;
  border-radius:50%;
  background:rgba(255,255,255,.16);
  color:#fff;
  display:grid;
  place-items:center;
  font-size:1.3rem;
  transition:.25s;
  line-height:1;
}
.modal-close:hover{background:rgba(255,255,255,.3);transform:rotate(90deg)}

.modal-body{
  padding:20px 26px 24px;
  overflow-y:auto;
  flex:1;
}
.modal-body::-webkit-scrollbar{width:6px}
.modal-body::-webkit-scrollbar-thumb{background:#cdd9d2;border-radius:99px}

.spot{
  display:flex;
  gap:14px;
  padding:14px 0;
  border-bottom:1px dashed var(--line);
}
.spot:last-child{border-bottom:none}
.spot-num{
  width:30px;height:30px;
  border-radius:9px;
  flex:none;
  background:#eef4f1;
  color:var(--green);
  font-weight:700;
  font-size:.88rem;
  display:grid;
  place-items:center;
}
.spot h4{
  font-size:1.02rem;
  font-weight:600;
  color:var(--green-dark);
  margin-bottom:3px;
}
.spot p{font-size:.89rem;color:var(--muted);line-height:1.6}

.visit-btn{
  width:calc(100% - 52px);
  margin:0 26px 22px;
  padding:14px;
  border-radius:13px;
  font-weight:600;
  font-size:1rem;
  transition:.28s;
  background:var(--green);
  color:#fff;
  box-shadow:0 8px 24px rgba(0,106,78,.3);
  flex:none;
}
.visit-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 30px rgba(0,106,78,.4);
}
.visit-btn.active{
  background:var(--red);
  box-shadow:0 8px 24px rgba(244,42,65,.32);
}
.visit-btn.active:hover{

const DIVISIONS = ["ঢাকা","চট্টগ্রাম","রাজশাহী","খুলনা","বরিশাল","সিলেট","রংপুর","ময়মনসিংহ"];
const STORAGE_KEY = "bd_tourist_visited_home_v1";

const BN = ["০","১","২","৩","৪","৫","৬","৭","৮","৯"];
const bn = n => String(n).replace(/\d/g, d => BN[+d]);

function getVisited(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? new Set(JSON.parse(raw)) : new Set();
  }catch(e){ return new Set(); }
}
function saveVisited(set){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify([...set])); }catch(e){}
}
function toggleVisited(id){
  const v = getVisited();
  if (v.has(id)) v.delete(id); else v.add(id);
  saveVisited(v);
  return v;
}
const getDistrict = id => DISTRICTS.find(d => d.id === id);

/* ============================================================
   ম্যাপ সেটআপ — OpenStreetMap (100% ফ্রি, কোনো API key নেই)
   ============================================================ */
let map, markers = {};
let visited = getVisited();
let activeId = null;

function initMap(){
  map = L.map('map', {
    zoomControl: false,
    scrollWheelZoom: true,
    worldCopyJump: false,
    minZoom: 6,
    maxZoom: 12,
    maxBounds: [[19.5, 86.5], [27.5, 94.0]],
    maxBoundsViscosity: 0.7
  }).setView([23.7, 90.35], 7);

  /* ===== ফ্রি টাইল — OpenStreetMap ===== */
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors',
    crossOrigin: true
  }).addTo(map);

  /* জুম কন্ট্রোল ডান-নিচে */
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  /* জেলা মার্কার */
  DISTRICTS.forEach(d => {
    const m = L.circleMarker([d.lat, d.lng], {
      radius: 9,
      color: "#ffffff",
      weight: 2.5,
      fillColor: "#b9c3bd",
      fillOpacity: 1
    }).addTo(map);

    m.bindTooltip(d.name, {
      direction: "top",
      offset: [0, -8],
      className: "district-tip"
    });

    m.on('click', () => openPopup(d, m));
    m.on('mouseover', function(){ this.setRadius(12); });
    m.on('mouseout', function(){
      this.setRadius(visited.has(d.id) ? 10 : 9);
    });

    markers[d.id] = m;
  });

  map.fitBounds([[20.4, 87.9], [26.7, 92.8]]);
  refreshMarkers();
  updateStats();
}

function refreshMarkers(){
  DISTRICTS.forEach(d => {
    const m = markers[d.id];
    if (!m) return;
    if (visited.has(d.id)){
      m.setStyle({ fillColor: "#006A4E", color: "#fff", weight: 3 });
      m.setRadius(10);
      m.bindTooltip(d.name + " ✓", {
        direction: "top", offset: [0,-8], className: "district-tip visited"
      });
    } else {
      m.setStyle({ fillColor: "#b9c3bd", color: "#fff", weight: 2.5 });
      m.setRadius(9);
      m.bindTooltip(d.name, {
        direction: "top", offset: [0,-8], className: "district-tip"
      });
    }
  });
}

function openPopup(d, m){
  const isV = visited.has(d.id);
  const html = `
    <div class="popup-head">
      <h3>${d.name}</h3>
      <span>${d.division} বিভাগ • ${bn(d.spots.length)}টি দর্শনীয় স্থান</span>
    </div>
    <div class="popup-body">
      <p>${d.spots[0][0]}${d.spots[1] ? ' • ' + d.spots[1][0] : ''}${d.spots[2] ? ' সহ আরও...' : ''}</p>
      <div class="popup-actions">
        <button class="popup-btn btn-detail" data-action="detail">📖 বিস্তারিত</button>
        <button class="popup-btn btn-mark ${isV?'active':''}" data-action="mark">
          ${isV ? '✓ ভ্রমণ করেছি' : '○ চিহ্নিত করুন'}
        </button>
      </div>
    </div>
  `;

  const popup = L.popup({
    maxWidth: 280,
    minWidth: 260,
    closeButton: true,
    offset: [0, -6],
    autoPan: true,
    autoPanPadding: [40, 100]
  }).setLatLng([d.lat, d.lng]).setContent(html).openOn(map);

  setTimeout(() => {
    const popupEl = document.querySelector('.leaflet-popup-content');
    if (!popupEl) return;
    popupEl.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (btn.dataset.action === 'mark'){
          toggleVisited(d.id);
          visited = getVisited();
          refreshMarkers();
          updateStats();
          renderPanelList();
          map.closePopup();
          openPopup(d, m);
          showToast(visited.has(d.id)
            ? `✓ ${d.name} চিহ্নিত হয়েছে`
            : `○ ${d.name} থেকে মুছে ফেলা হয়েছে`,
            !visited.has(d.id));
        } else {
          openModal(d.id);
          map.closePopup();
        }
      });
    });
  }, 60);
}

/* ============================================================
   স্ট্যাটস আপডেট
   ============================================================ */
function updateStats(){
  const total = DISTRICTS.length;
  const count = visited.size;
  const pct = Math.round((count / total) * 100);

  // হেডার
  document.getElementById('navVisited').textContent = bn(count);
  document.getElementById('navPct').textContent = bn(pct) + '%';

  // প্রোগ্রেস পিল
  document.getElementById('progressPct').textContent = bn(pct) + '%';
  document.getElementById('progressRing').style.setProperty('--p', pct);
  document.getElementById('progressVisited').textContent = bn(count);

  // প্যানেল
  document.getElementById('panelPct').textContent = bn(pct) + '%';
  document.getElementById('panelRing').style.setProperty('--p', pct);
  document.getElementById('panelVisited').textContent = bn(count);
  document.getElementById('panelRemain').textContent = bn(total - count);
}

  panelOverlay.classList.add('open');

  panelOverlay.classList.remove('open');
}

panelOverlay.addEventListener('click', closePanel);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    closePanel();
    closeModal();
  }
});

/* ট্যাব */
function renderTabs(){
  const el = document.getElementById('panelTabs');
  el.innerHTML = ['সব', ...DIVISIONS].map(d =>
    `<button class="tab ${d===currentDiv?'active':''}" data-div="${d}">${d}</button>`
  ).join('');
  el.querySelectorAll('.tab').forEach(b => {
    b.addEventListener('click', () => {
      currentDiv = b.dataset.div;
      renderTabs();
      renderPanelList();
    });
  });
}

/* লিস্ট */
function renderPanelList(){
  const list = document.getElementById('panelList');
  const q = searchQuery.trim().toLowerCase();

  const filtered = DISTRICTS.filter(d => {
    if (currentDiv !== 'সব' && d.division !== currentDiv) return false;
    if (!q) return true;
    return d.name.toLowerCase().includes(q)
      || d.division.toLowerCase().includes(q)
      || d.spots.some(s => s[0].toLowerCase().includes(q) || s[1].toLowerCase().includes(q));
  });

  if (!filtered.length){
    list.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="M20 20l-3.5-3.5"></path>
        </svg>
        <p>কোনো ফলাফল পাওয়া যায়নি</p>
      </div>`;
    return;
  }

  list.innerHTML = filtered.map(d => {
    const isV = visited.has(d.id);
    return `
      <div class="district-item ${isV?'visited':''}" data-id="${d.id}">
        <div class="di-tick">${isV?'✓':'○'}</div>
        <div class="di-body">
          <div class="di-name">${d.name} <span class="di-div">${d.division}</span></div>
          <div class="di-spot">${d.spots[0][0]}${d.spots[1] ? ' • '+d.spots[1][0] : ''}</div>
        </div>
        <div class="di-arrow">›</div>
      </div>`;
  }).join('');

  list.querySelectorAll('.district-item').forEach(el => {
    el.addEventListener('click', () => {
      const d = getDistrict(el.dataset.id);
      if (!d) return;
      closePanel();
      map.flyTo([d.lat, d.lng], 9, { duration: 0.8 });
      setTimeout(() => openPopup(d, markers[d.id]), 900);
    });
  });
}

/* ============================================================
   সার্চ
   ============================================================ */
const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');

searchInput.addEventListener('input', e => {
  searchQuery = e.target.value;
  clearBtn.classList.toggle('show', searchQuery.length > 0);
  renderPanelList();
});

searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter'){
    const q = searchQuery.trim().toLowerCase();
    if (!q) return;
    const found = DISTRICTS.find(x =>
      x.name.toLowerCase().includes(q) ||
      x.division.toLowerCase().includes(q) ||
      x.spots.some(s => s[0].toLowerCase().includes(q))
    );
    if (found){
      map.flyTo([found.lat, found.lng], 9, { duration: 0.9 });
      setTimeout(() => openPopup(found, markers[found.id]), 950);
      hideHint();
    }
  }
});

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  searchQuery = '';
  clearBtn.classList.remove('show');
  renderPanelList();
  searchInput.focus();
});

/* ============================================================
   মোডাল
   ============================================================ */
const modalOverlay = document.getElementById('modalOverlay');

function openModal(id){
  const d = getDistrict(id);
  if (!d) return;
  activeId = id;

  document.getElementById('modalTitle').textContent = d.name + ' জেলা';
  document.getElementById('modalSub').textContent =
    d.division + ' বিভাগ • ' + bn(d.spots.length) + 'টি দর্শনীয় স্থান';

  document.getElementById('modalBody').innerHTML = d.spots.map((s,i) => `
    <div class="spot">
      <div class="spot-num">${bn(i+1)}</div>
      <div>
        <h4>${s[0]}</h4>
        <p>${s[1]}</p>
      </div>
    </div>
  `).join('');

  updateVisitBtn();
  modalOverlay.classList.add('open');
}

function updateVisitBtn(){
  const btn = document.getElementById('visitBtn');
  if (visited.has(activeId)){
    btn.textContent = '✓ ভ্রমণ করেছি (মুছতে ক্লিক করুন)';
    btn.classList.add('active');
  } else {
    btn.textContent = '○ ভ্রমণ করেছি হিসেবে চিহ্নিত করুন';
    btn.classList.remove('active');
  }
}

function closeModal(){
  modalOverlay.classList.remove('open');
  activeId = null;
}

document.getElementById('modalClose').addEventListener('click', closeModal);
modalOverlay.addEventListener('click', e => {
  if (e.target === modalOverlay) closeModal();
});

document.getElementById('visitBtn').addEventListener('click', () => {
  if (!activeId) return;
  const d = getDistrict(activeId);
  const wasV = visited.has(activeId);
  toggleVisited(activeId);
  visited = getVisited();
  updateVisitBtn();
  updateStats();
  refreshMarkers();
  renderPanelList();
  showToast(wasV
    ? `○ ${d.name} থেকে মুছে ফেলা হয়েছে`
    : `✓ ${d.name} ভ্রমণ তালিকায় যোগ হয়েছে`,
    wasV);
});

/* ============================================================
   টোস্ট
   ============================================================ */
let toastTimer;
function showToast(msg, red=false){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('red', red);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ============================================================
   ম্যাপ হিন্ট হাইড
   ============================================================ */
function hideHint(){
  const h = document.getElementById('mapHint');
  if (h) h.classList.add('hide');
}
document.getElementById('map').addEventListener('click', hideHint, { once: true });

/* ============================================================
   হোম ভিউ
   ============================================================ */
function flyHome(){
  map.flyTo([23.7, 90.35], 7, { duration: 1 });
  map.closePopup();
  closePanel();
}
window.flyHome = flyHome;

/* ============================================================
   ইনিশিয়ালাইজ
   ============================================================ */
(function init(){
  initMap();
  renderTabs();
  renderPanelList();
  updateStats();
})();
</script>
