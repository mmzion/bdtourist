<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>আমার বাংলাদেশ — ভ্রমণ ম্যাপ ও গাইড</title>
<meta name="description" content="বাংলাদেশের ৬৪ জেলার দর্শনীয় স্থান, ইন্টারঅ্যাক্টিভ ম্যাপ ও ভ্রমণ অগ্রগতি ট্র্যাকার।">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23006A4E'/><circle cx='50' cy='50' r='26' fill='%23F42A41'/></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
/* ================= বেসিক ================= */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --green:#006A4E;
  --green-dark:#00432f;
  --green-light:#0b8a67;
  --red:#F42A41;
  --cream:#f4f7f4;
  --ink:#0f231c;
  --muted:#5f7068;
  --line:#e0e7e2;
  --card:#ffffff;
  --shadow-sm:0 2px 10px rgba(0,60,44,.06);
  --shadow:0 8px 30px rgba(0,60,44,.12);
  --shadow-lg:0 20px 60px rgba(0,60,44,.2);
}
html,body{height:100%}
body{
  font-family:'Hind Siliguri',system-ui,-apple-system,sans-serif;
  background:var(--cream);
  color:var(--ink);
  line-height:1.65;
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit}
a{text-decoration:none;color:inherit}

/* ================= লেআউট ================= */
.app{
  display:grid;
  grid-template-rows:auto 1fr;
  height:100vh;
  height:100dvh;
}

/* ================= হেডার ================= */
header{
  background:linear-gradient(135deg,var(--green) 0%,var(--green-dark) 100%);
  color:#fff;
  padding:0;
  box-shadow:0 4px 20px rgba(0,0,0,.15);
  position:relative;
  z-index:1000;
}
.nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:11px 22px;
  gap:16px;
  flex-wrap:wrap;
}
.brand{
  display:flex;
  align-items:center;
  gap:11px;
  font-weight:700;
  font-size:1.12rem;
  letter-spacing:.2px;
}
.brand-mark{
  width:26px;height:26px;border-radius:50%;
  background:var(--red);
  box-shadow:0 0 0 3px rgba(255,255,255,.22);
  flex:none;
  animation:pulse 3s ease-in-out infinite;
}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(255,255,255,.22)}50%{box-shadow:0 0 0 7px rgba(255,255,255,.08)}}

.header-stats{
  display:flex;
  align-items:center;
  gap:20px;
  font-size:.85rem;
  opacity:.95;
}
.header-stats b{font-size:1.05rem;font-weight:700;color:#ffd166}
.top-bar{
  height:3px;
  background:rgba(255,255,255,.15);
  overflow:hidden;
}
.top-bar span{
  display:block;
  height:100%;
  width:0;
  background:linear-gradient(90deg,#ffd166,var(--red));
  transition:width .7s cubic-bezier(.22,1,.36,1);
}

/* ================= মেইন ================= */
.main{
  display:grid;
  grid-template-columns:1.6fr 1fr;
  overflow:hidden;
  position:relative;
}

/* ================= ম্যাপ ================= */
.map-wrap{
  position:relative;
  background:#dfe8e3;
  overflow:hidden;
}
#map{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:1;
}
.map-overlay{
  position:absolute;
  z-index:500;
  pointer-events:none;
}
.map-overlay.top{
  top:16px;left:16px;right:16px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  flex-wrap:wrap;
}
.map-overlay.bottom{
  bottom:16px;left:16px;
  pointer-events:none;
}
.map-search{
  pointer-events:auto;
  background:#fff;
  border-radius:14px;
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  padding:0 14px;
  max-width:340px;
  flex:1;
  min-width:200px;
}
.map-search svg{opacity:.5;flex:none}
.map-search input{
  border:none;
  outline:none;
  padding:12px 10px;
  font-size:.95rem;
  width:100%;
  background:transparent;
  color:var(--ink);
}
.legend{
  pointer-events:auto;
  background:#fff;
  border-radius:14px;
  box-shadow:var(--shadow);
  padding:8px 14px;
  display:flex;
  gap:14px;
  font-size:.82rem;
  color:var(--muted);
  font-weight:500;
}
.legend i{
  width:11px;height:11px;border-radius:50%;
  display:inline-block;margin-right:6px;vertical-align:middle;
}
.dot-v{background:var(--green);box-shadow:0 0 0 3px rgba(0,106,78,.2)}
.dot-u{background:#b9c3bd}

.map-hint{
  pointer-events:auto;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(8px);
  border-radius:999px;
  box-shadow:var(--shadow);
  padding:7px 16px;
  font-size:.82rem;
  color:var(--muted);
  font-weight:500;
  display:inline-flex;
  align-items:center;
  gap:6px;
}

/* Leaflet কাস্টমাইজ */
.leaflet-container{
  font-family:'Hind Siliguri',sans-serif;
  background:#dfe8e3;
}
.leaflet-tooltip.district-tip{
  font-family:'Hind Siliguri',sans-serif;
  font-weight:600;
  font-size:.82rem;
  background:var(--green-dark);
  color:#fff;
  border:none;
  border-radius:8px;
  padding:4px 10px;
  box-shadow:0 4px 14px rgba(0,0,0,.25);
}
.leaflet-tooltip.district-tip::before{border-top-color:var(--green-dark)}
.leaflet-tooltip.district-tip.visited{background:var(--red)}
.leaflet-tooltip.district-tip.visited::before{border-top-color:var(--red)}
.leaflet-control-zoom{
  border:none !important;
  box-shadow:var(--shadow) !important;
  border-radius:12px !important;
  overflow:hidden;
}
.leaflet-control-zoom a{
  background:#fff !important;
  color:var(--green-dark) !important;
  border-color:var(--line) !important;
  font-weight:700 !important;
  width:36px !important;
  height:36px !important;
  line-height:36px !important;
  font-size:1.2rem !important;
}
.leaflet-control-zoom a:hover{background:#f0f6f2 !important;color:var(--green) !important}
.leaflet-control-attribution{
  background:rgba(255,255,255,.85) !important;
  font-size:.7rem !important;
  border-radius:8px 0 0 0;
}

/* ================= সাইড প্যানেল ================= */
.panel{
  background:var(--cream);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border-left:1px solid var(--line);
  position:relative;
}
.panel-head{
  background:#fff;
  padding:20px 22px 18px;
  border-bottom:1px solid var(--line);
  flex:none;
}
.panel-head-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
}
.panel-title{
  font-size:1.05rem;
  font-weight:700;
  color:var(--green-dark);
}
.panel-sub{
  font-size:.82rem;
  color:var(--muted);
  font-weight:500;
}
.reset-mini{
  font-size:.78rem;
  font-weight:600;
  color:var(--red);
  padding:6px 12px;
  border-radius:999px;
  background:#fdecee;
  transition:.22s;
  white-space:nowrap;
}
.reset-mini:hover{background:var(--red);color:#fff}

.progress-block{
  display:flex;
  align-items:center;
  gap:18px;
}
.ring{
  --p:0;
  width:88px;height:88px;
  border-radius:50%;
  background:conic-gradient(var(--red) calc(var(--p)*1%),#e4e9e5 0);
  display:grid;place-items:center;
  position:relative;
  flex:none;
  transition:background .8s cubic-bezier(.22,1,.36,1);
}
.ring::after{
  content:"";position:absolute;inset:7px;
  border-radius:50%;
  background:#fff;
  box-shadow:inset 0 2px 10px rgba(0,60,44,.06);
}
.ring-inner{position:relative;z-index:2;text-align:center;line-height:1.1}
.ring-inner b{font-size:1.5rem;font-weight:700;color:var(--green-dark);display:block}
.ring-inner small{font-size:.66rem;color:var(--muted);font-weight:500}

.progress-info{flex:1;min-width:0}
.progress-info-row{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  margin-bottom:3px;
}
.progress-info-row:last-child{margin-bottom:0;margin-top:10px}
.progress-info-row span{font-size:.82rem;color:var(--muted);font-weight:500}
.progress-info-row b{font-size:1.05rem;color:var(--green-dark);font-weight:700}
.progress-info-row b.red{color:var(--red)}

/* ================= ফিল্টার ট্যাব ================= */
.tabs{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding:12px 22px;
  background:#fff;
  border-bottom:1px solid var(--line);
  scrollbar-width:none;
  flex:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:6px 14px;
  border-radius:999px;
  font-size:.84rem;
  font-weight:500;
  color:var(--muted);
  background:#eef2ef;
  transition:.22s;
  white-space:nowrap;
  flex:none;
  border:1.4px solid transparent;
}
.tab:hover{background:#e2ebe6;color:var(--green)}
.tab.active{background:var(--green);color:#fff;box-shadow:0 4px 14px rgba(0,106,78,.3)}

/* ================= জেলা লিস্ট ================= */
.list{
  flex:1;
  overflow-y:auto;
  padding:14px 14px 24px;
}
.list::-webkit-scrollbar{width:8px}
.list::-webkit-scrollbar-track{background:transparent}
.list::-webkit-scrollbar-thumb{background:#cdd9d2;border-radius:99px}
.list::-webkit-scrollbar-thumb:hover{background:#a8b8ae}

.district-item{
  background:#fff;
  border-radius:14px;
  padding:14px 16px;
  margin-bottom:9px;
  display:flex;
  align-items:center;
  gap:13px;
  cursor:pointer;
  transition:.22s;
  border:1.5px solid transparent;
  box-shadow:0 1px 4px rgba(0,60,44,.04);
}
.district-item:hover{
  transform:translateX(3px);
  box-shadow:var(--shadow-sm);
  border-color:#cfe0d8;
}
.district-item.visited{
  background:linear-gradient(135deg,#f0faf5,#ffffff);
  border-color:#bfe3d5;
}
.di-tick{
  width:36px;height:36px;
  border-radius:11px;
  background:#eef2ef;
  color:#9aa8a1;
  display:grid;
  place-items:center;
  font-size:.95rem;
  font-weight:700;
  flex:none;
  transition:.25s;
}
.district-item.visited .di-tick{
  background:var(--green);
  color:#fff;
  box-shadow:0 4px 12px rgba(0,106,78,.35);
}
.di-body{flex:1;min-width:0}
.di-name{
  font-size:1rem;
  font-weight:600;
  color:var(--green-dark);
  display:flex;
  align-items:center;
  gap:7px;
  margin-bottom:2px;
}
.di-div{
  font-size:.72rem;
  font-weight:500;
  color:var(--green);
  background:#eef4f1;
  padding:1px 8px;
  border-radius:999px;
  flex:none;
}
.di-spot{
  font-size:.82rem;
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.di-arrow{
  color:#c4d0c9;
  font-size:1.1rem;
  flex:none;
  transition:.22s;
}
.district-item:hover .di-arrow{
  color:var(--green);
  transform:translateX(2px);
}

.empty-state{
  text-align:center;
  padding:50px 20px;
  color:var(--muted);
}
.empty-state svg{opacity:.35;margin-bottom:12px}
.empty-state p{font-size:.92rem}

/* ================= মোডাল (ডিটেইল) ================= */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(8,30,23,.55);
  backdrop-filter:blur(6px);
  z-index:2000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  opacity:0;
  visibility:hidden;
  transition:.3s;
}
.overlay.open{opacity:1;visibility:visible}

.modal{
  background:#fff;
  border-radius:22px;
  width:100%;
  max-width:560px;
  max-height:88vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  box-shadow:0 30px 80px rgba(0,0,0,.4);
  transform:translateY(28px) scale(.97);
  transition:.35s cubic-bezier(.22,1,.36,1);
}
.overlay.open .modal{transform:translateY(0) scale(1)}

.modal-head{
  background:linear-gradient(135deg,var(--green),var(--green-dark));
  color:#fff;
  padding:24px 26px 20px;
  position:relative;
  flex:none;
}
.modal-head h2{
  font-size:1.5rem;
  font-weight:700;
  margin-bottom:3px;
}
.modal-head span{opacity:.85;font-size:.88rem}
.close-btn{
  position:absolute;
  right:16px;top:16px;
  width:34px;height:34px;
  border-radius:50%;
  background:rgba(255,255,255,.16);
  color:#fff;
  display:grid;
  place-items:center;
  font-size:1.25rem;
  transition:.25s;
  line-height:1;
}
.close-btn:hover{background:rgba(255,255,255,.3);transform:rotate(90deg)}

.modal-body{
  padding:20px 26px 24px;
  overflow-y:auto;
  flex:1;
}
.modal-body::-webkit-scrollbar{width:6px}
.modal-body::-webkit-scrollbar-thumb{background:#cdd9d2;border-radius:99px}

.spot{
  display:flex;
  gap:13px;
  padding:13px 0;
  border-bottom:1px dashed var(--line);
}
.spot:last-child{border-bottom:none}
.spot-num{
  width:28px;height:28px;
  border-radius:9px;
  flex:none;
  background:#eef4f1;
  color:var(--green);
  font-weight:700;
  font-size:.85rem;
  display:grid;
  place-items:center;
}
.spot h4{
  font-size:1rem;
  font-weight:600;
  color:var(--green-dark);
  margin-bottom:3px;
}
.spot p{font-size:.88rem;color:var(--muted);line-height:1.6}

.visit-btn{
  width:100%;
  margin-top:18px;
  padding:14px;
  border-radius:13px;
  font-weight:600;
  font-size:1rem;
  transition:.28s;
  background:var(--green);
  color:#fff;
  box-shadow:0 8px 24px rgba(0,106,78,.3);
  flex:none;
}
.visit-btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,106,78,.4)}
.visit-btn.active{
  background:var(--red);
  box-shadow:0 8px 24px rgba(244,42,65,.32);
}

/* ================= টোস্ট ================= */
.toast{
  position:fixed;
  bottom:26px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--green-dark);
  color:#fff;
  padding:12px 24px;
  border-radius:999px;
  font-size:.9rem;
  font-weight:500;
  box-shadow:0 12px 32px rgba(0,0,0,.3);
  opacity:0;
  visibility:hidden;
  transition:.3s;
  z-index:3000;
  display:flex;
  align-items:center;
  gap:8px;
}
.toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.toast.red{background:var(--red)}

/* ================= মোবাইল ================= */
.mobile-toggle{display:none}

@media(max-width:900px){
  .main{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .panel{
    position:absolute;
    left:0;right:0;bottom:0;
    top:auto;
    height:60%;
    border-left:none;
    border-top:1px solid var(--line);
    border-radius:22px 22px 0 0;
    box-shadow:0 -12px 40px rgba(0,0,0,.15);
    transform:translateY(calc(100% - 72px));
    transition:transform .38s cubic-bezier(.22,1,.36,1);
    z-index:800;
    max-height:78vh;
  }
  .panel.open{transform:translateY(0)}
  .panel-handle{
    display:block;
    width:44px;height:5px;
    background:#cdd9d2;
    border-radius:99px;
    margin:10px auto 0;
    flex:none;
  }
  .panel-head{padding-top:8px}
  .header-stats{font-size:.78rem;gap:14px}
  .header-stats b{font-size:.95rem}
  .map-search{max-width:none}
  .legend{font-size:.76rem;padding:6px 11px;gap:10px}
  .map-hint{font-size:.76rem;padding:6px 12px}
  .brand span.brand-text{font-size:1rem}
  .ring{width:74px;height:74px}
  .ring-inner b{font-size:1.25rem}
}
@media(max-width:520px){
  .nav{padding:9px 14px}
  .brand{font-size:1rem}
  .brand-mark{width:22px;height:22px}
  .header-stats{gap:10px}
  .map-overlay.top{top:10px;left:10px;right:10px}
  .map-overlay.bottom{bottom:10px;left:10px}
  .list{padding:12px 12px 20px}
  .district-item{padding:12px 14px;gap:11px}
  .di-tick{width:32px;height:32px;font-size:.85rem}
  .di-name{font-size:.94rem}
  .modal-head h2{font-size:1.3rem}
  .modal-body{padding:16px 20px 20px}
  .panel-head{padding:8px 16px 14px}
  .tabs{padding:10px 16px}
}
@media(min-width:901px){
  .panel-handle{display:none}
}
</style>
</head>

<body>

<div class="app">

  <!-- ========== হেডার ========== -->
  <header>
    <nav class="nav">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-text">আমার বাংলাদেশ</span>
      </div>
      <div class="header-stats">
        <div><b id="hVisited">০</b> / ৬৪ জেলা</div>
        <div><b id="hPct">০%</b> সম্পন্ন</div>
      </div>
    </nav>
    <div class="top-bar"><span id="topBar"></span></div>
  </header>

  <!-- ========== মেইন ========== -->
  <div class="main">

    <!-- ===== ম্যাপ ===== -->
    <div class="map-wrap">
      <div id="map"></div>

      <div class="map-overlay top">
        <div class="map-search">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
          </svg>
          <input type="text" id="mapSearch" placeholder="জেলা বা স্থান খুঁজুন...">
        </div>
        <div class="legend">
          <span><i class="dot-v"></i>ভ্রমণ করেছি</span>
          <span><i class="dot-u"></i>বাকি আছে</span>
        </div>
      </div>

      <div class="map-overlay bottom">
        <div class="map-hint">
          <span>👆</span> ম্যাপে ক্লিক করে জেলা দেখুন
        </div>
      </div>
    </div>

    <!-- ===== সাইড প্যানেল ===== -->
    <aside class="panel" id="panel">
      <div class="panel-handle" id="panelHandle"></div>

      <div class="panel-head">
        <div class="panel-head-top">
          <div>
            <div class="panel-title">আমার ভ্রমণ অগ্রগতি</div>
            <div class="panel-sub">যে জেলাগুলোতে ঘুরেছেন চিহ্নিত করুন</div>
          </div>
          <button class="reset-mini" id="resetBtn">↺ রিসেট</button>
        </div>

        <div class="progress-block">
          <div class="ring" id="ring">
            <div class="ring-inner">
              <b id="ringPct">০%</b>
              <small>সম্পন্ন</small>
            </div>
          </div>
          <div class="progress-info">
            <div class="progress-info-row">
              <span>ভ্রমণ করেছি</span>
              <b id="pVisited">০ জেলা</b>
            </div>
            <div class="progress-info-row">
              <span>বাকি আছে</span>
              <b class="red" id="pRemain">৬৪ জেলা</b>
            </div>
          </div>
        </div>
      </div>

      <div class="tabs" id="tabs"></div>

      <div class="list" id="list"></div>
    </aside>

  </div>
</div>

<!-- ========== মোডাল ========== -->

/* ============================================================
   ২) হেল্পার
   ============================================================ */
const BN = ["০","১","২","৩","৪","৫","৬","৭","৮","৯"];
const bn = n => String(n).replace(/\d/g, d => BN[+d]);

const DIVISIONS = ["ঢাকা","চট্টগ্রাম","রাজশাহী","খুলনা","বরিশাল","সিলেট","রংপুর","ময়মনসিংহ"];
const STORAGE_KEY = "bd_tourist_visited_v2";

let visited = new Set();
try {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) visited = new Set(JSON.parse(raw));
} catch(e){}
const save = () => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...visited])); } catch(e){} };

/* ============================================================
   ৩) ম্যাপ
   ============================================================ */
let map, markers = {}, activeId = null;

function initMap(){
  map = L.map('map', {
    zoomControl:true,
    scrollWheelZoom:true,
    attributionControl:true
  }).setView([23.7, 90.35], 7);

  // পরিষ্কার, লাইট টাইল
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 18,
    subdomains: 'abcd',
    attribution: '&copy; OpenStreetMap &copy; CARTO'
  }).addTo(map);

  DISTRICTS.forEach(d => {
    const m = L.circleMarker([d.lat, d.lng], {
      radius: 9,
      color: "#ffffff",
      weight: 2.5,
      fillColor: "#b9c3bd",
      fillOpacity: 1,
      className: "district-marker"
    }).addTo(map);

    m.bindTooltip(d.name, { direction:"top", offset:[0,-8], className:"district-tip" });

    m.on('click', () => {
      openModal(d.id);
      flyToDistrict(d);
    });
    m.on('mouseover', function(){ this.setRadius(12); });
    m.on('mouseout',  function(){ this.setRadius(visited.has(d.id) ? 10 : 9); });

    markers[d.id] = m;
  });

  map.fitBounds([[20.4, 87.9], [26.7, 92.8]]);
  refreshMarkers();
}

function refreshMarkers(){
  DISTRICTS.forEach(d => {
    const m = markers[d.id];
    if (!m) return;
    if (visited.has(d.id)){
      m.setStyle({ fillColor:"#006A4E", color:"#fff", weight:3 });
      m.setRadius(10);
      m.bindTooltip(d.name + " ✓", { direction:"top", offset:[0,-8], className:"district-tip visited" });
    } else {
      m.setStyle({ fillColor:"#b9c3bd", color:"#fff", weight:2.5 });
      m.setRadius(9);
      m.bindTooltip(d.name, { direction:"top", offset:[0,-8], className:"district-tip" });
    }
  });
}

function flyToDistrict(d){
  map.flyTo([d.lat, d.lng], Math.max(map.getZoom(), 9), { duration:0.7 });
}

/* ============================================================
   ৪) স্ট্যাটস
   ============================================================ */
function updateStats(){
  const total = DISTRICTS.length;
  const count = visited.size;
  const pct = Math.round((count/total)*100);

  document.getElementById("ringPct").textContent = bn(pct) + "%";
  document.getElementById("ring").style.setProperty("--p", pct);
  document.getElementById("pVisited").textContent = bn(count) + " জেলা";
  document.getElementById("pRemain").textContent = bn(total - count) + " জেলা";
  document.getElementById("hVisited").textContent = bn(count);
  document.getElementById("hPct").textContent = bn(pct) + "%";
  document.getElementById("topBar").style.width = pct + "%";
}

/* ============================================================
   ৫) ট্যাব ও লিস্ট
   ============================================================ */
let currentDiv = "সব";
let currentQuery = "";

function renderTabs(){
  const el = document.getElementById("tabs");
  const all = ["সব", ...DIVISIONS];
  el.innerHTML = all.map(d =>
    `<button class="tab ${d===currentDiv?'active':''}" data-div="${d}">${d}</button>`
  ).join("");

  el.querySelectorAll(".tab").forEach(b => {
    b.addEventListener("click", () => {
      currentDiv = b.dataset.div;
      renderTabs();
      renderList();
    });
  });
}

function renderList(){
  const list = document.getElementById("list");
  const q = currentQuery.trim().toLowerCase();

  const filtered = DISTRICTS.filter(d => {
    if (currentDiv !== "সব" && d.division !== currentDiv) return false;
    if (!q) return true;
    return d.name.toLowerCase().includes(q)
      || d.division.toLowerCase().includes(q)
      || d.spots.some(s => s[0].toLowerCase().includes(q) || s[1].toLowerCase().includes(q));
  });

  if (!filtered.length){
    list.innerHTML = `
      <div class="empty-state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
        </svg>
        <p>কোনো ফলাফল পাওয়া যায়নি</p>
      </div>`;
    return;
  }

  list.innerHTML = filtered.map(d => {
    const isV = visited.has(d.id);
    return `
      <div class="district-item ${isV?'visited':''}" data-id="${d.id}">
        <div class="di-tick">${isV?'✓':'○'}</div>
        <div class="di-body">
          <div class="di-name">${d.name} <span class="di-div">${d.division}</span></div>
          <div class="di-spot">${d.spots[0][0]}${d.spots[1] ? ' • '+d.spots[1][0] : ''}</div>
        </div>
        <div class="di-arrow">›</div>
      </div>`;
  }).join("");

  list.querySelectorAll(".district-item").forEach(el => {
    el.addEventListener("click", () => {
      const d = DISTRICTS.find(x => x.id === el.dataset.id);
      openModal(d.id);
      flyToDistrict(d);
    });
  });
}

/* ============================================================
   ৬) মোডাল
   ============================================================ */
const overlay = document.getElementById("overlay");

function openModal(id){
  const d = DISTRICTS.find(x => x.id === id);
  if (!d) return;
  activeId = id;

  document.getElementById("mTitle").textContent = d.name + " জেলা";
  document.getElementById("mSub").textContent = d.division + " বিভাগ • " + bn(d.spots.length) + "টি দর্শনীয় স্থান";

  document.getElementById("mSpots").innerHTML = d.spots.map((s,i) => `
    <div class="spot">
      <div class="spot-num">${bn(i+1)}</div>
      <div>
        <h4>${s[0]}</h4>
        <p>${s[1]}</p>
      </div>
    </div>
  `).join("");

  updateVisitBtn();
  overlay.classList.add("open");
}

function updateVisitBtn(){
  const btn = document.getElementById("mVisitBtn");
  if (visited.has(activeId)){
    btn.textContent = "✓ ভ্রমণ করেছি (মুছতে ক্লিক করুন)";
    btn.classList.add("active");
  } else {
    btn.textContent = "○ ভ্রমণ করেছি হিসেবে চিহ্নিত করুন";
    btn.classList.remove("active");
  }
}

function closeModal(){
  overlay.classList.remove("open");
  activeId = null;
}

document.getElementById("closeModal").addEventListener("click", closeModal);
overlay.addEventListener("click", e => { if (e.target === overlay) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

document.getElementById("mVisitBtn").addEventListener("click", () => {
  if (!activeId) return;
  const d = DISTRICTS.find(x => x.id === activeId);
  const wasVisited = visited.has(activeId);

  if (wasVisited) visited.delete(activeId);
  else visited.add(activeId);

  save();
  updateVisitBtn();
  updateStats();
  refreshMarkers();
  renderList();

  showToast(wasVisited ? `✗ ${d.name} তালিকা থেকে মুছে ফেলা হয়েছে` : `✓ ${d.name} ভ্রমণ তালিকায় যোগ হয়েছে`, wasVisited);
});

/* ============================================================
   ৭) সার্চ, রিসেট
   ============================================================ */
document.getElementById("mapSearch").addEventListener("input", e => {
  currentQuery = e.target.value;
  renderList();
});

document.getElementById("resetBtn").addEventListener("click", () => {
  if (!visited.size) return;
  if (confirm("আপনি কি সত্যিই সব ভ্রমণের তথ্য মুছে ফেলতে চান?")){
    visited.clear();
    save();
    updateStats();
    refreshMarkers();
    renderList();
    showToast("↺ সব তথ্য রিসেট করা হয়েছে", true);
  }
});

/* ============================================================
   ৮) টোস্ট
   ============================================================ */
let toastTimer;
function showToast(msg, red=false){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.toggle("red", red);
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2400);
}

/* ============================================================
   ৯) মোবাইল প্যানেল
   ============================================================ */
const panel = document.getElementById("panel");
document.getElementById("panelHandle").addEventListener("click", () => {
  panel.classList.toggle("open");
});

/* ============================================================
   ১০) ইনিশিয়ালাইজ
   ============================================================ */
(function init(){
  initMap();
  updateStats();
  renderTabs();
  renderList();
})();
</script>
